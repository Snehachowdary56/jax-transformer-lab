[project]
name = "tinyformer"
version = "1.0.0"
description = "A small decoder-only Transformer in JAX: data-parallel training with jax.sharding and continual learning experiments"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "optax>=0.2", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "E501"]
